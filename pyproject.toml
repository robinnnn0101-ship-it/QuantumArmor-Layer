[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumarmor-layer"
version = "0.1.0"
description = "Hybrid Quantum-Proof Layer for Bitcoin — by Vexlore"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vexlore", email = "vexlore@example.com"}
]
keywords = ["bitcoin", "post-quantum", "cryptography", "lamport", "quantum-resistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/vexlore/QuantumArmor-Layer"
Repository = "https://github.com/vexlore/QuantumArmor-Layer"
