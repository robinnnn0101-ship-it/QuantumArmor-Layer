[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumarmor-layer"
version = "0.7.1"
description = "Hybrid Quantum-Proof Layer for Bitcoin — by Vexlore (v0.7.1: commitment helpers, better CLI, integration docs)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vexlore", email = "vexlore@example.com"}
]
keywords = ["bitcoin", "post-quantum", "cryptography", "lamport", "wots", "merkle", "quantum-resistant", "vexlore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "ecdsa>=0.18.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
cli = []
dev = ["pytest>=7.0.0", "black", "ruff"]

[project.scripts]
quantumarmor = "quantumarmor.cli:main"

[project.urls]
Homepage = "https://github.com/robinnnn0101-ship-it/QuantumArmor-Layer"
Repository = "https://github.com/robinnnn0101-ship-it/QuantumArmor-Layer"
Documentation = "https://github.com/robinnnn0101-ship-it/QuantumArmor-Layer/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]

[tool.black]
line-length = 100
